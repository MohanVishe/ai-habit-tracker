name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The statistics have no LLM or network dependency, so they test on their
      # own. Installing streamlit and three provider SDKs to run them would be
      # a minute of CI time for nothing.
      - name: Install test dependencies
        run: pip install pytest

      - name: Run tests
        run: pytest -q
